services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ppat_app
    restart: unless-stopped
    ports:
      # Port diekspos secara lokal ke 127.0.0.1 agar aman dan hanya bisa diakses via Reverse Proxy Nginx Host
      - "127.0.0.1:${APP_PORT:-8085}:80"
    volumes:
      # Mount folder database agar file database.sqlite persisten di host
      - ./database:/var/www/html/database
      # Mount folder storage agar semua berkas upload, arsip, dan logs persisten di host
      - ./storage:/var/www/html/storage
      # Mount file .env dari host
      - ./.env:/var/www/html/.env
    environment:
      - APP_NAME=${APP_NAME:-PPAT_Iwan_Kurniawan}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://kantorppat-iwankurniawan.online}
      - APP_TIMEZONE=Asia/Jakarta
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
    networks:
      - ppat_network

networks:
  ppat_network:
    driver: bridge
